name: Refresh NCSC PHP product list

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate data/ncsc-php-products.csv from NCSC-NL/php2shell
        shell: pwsh
        run: ./scripts/ncsc-inventory-to-csv.ps1 -OutFile data/ncsc-php-products.csv
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncsc-php-products.csv
          git diff --cached --quiet || (git commit -m "Refresh NCSC PHP product list" && git push)
